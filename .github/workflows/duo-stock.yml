name: Watch Duo Stock

# Each run queues the next one as soon as it starts, then watches Apple and
# Duo Stock until 30 minutes past the next 3-hour mark and exits; the queued
# run picks up right away, so watching never stops. The schedule restarts the
# chain if it ever breaks. Run it by hand once to start immediately.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test alert when it starts
        type: boolean
        default: false

permissions:
  issues: write
  actions: write

concurrency:
  group: duo-stock
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run duo-stock.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Watch Apple and Duo Stock
        env:
          TEST_ALERT: ${{ inputs.test_alert && '1' || '' }}
          ZIP: "94536"
          MAX_MILES: "100"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATUS_TOPIC: ${{ secrets.NTFY_TOPIC && format('{0}-status', secrets.NTFY_TOPIC) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          end=$(( ( $(date +%s) / 10800 + 1 ) * 10800 + 1800 ))
          timeout $(( end - $(date +%s) )) node watch.js || [ $? -eq 124 ]
